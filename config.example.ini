# Canvas downloader settings
#
# 1. Make a copy of this file called config.ini (in this same folder).
# 2. Fill in the values below.
# 3. Run canvas_download.py (or double-click canvas-download.bat on Windows).
#
# config.ini is listed in .gitignore, so your token is never committed or
# uploaded anywhere. Never put your real token in config.example.ini.
#
# Don't want to edit files? Just run the script. If there's no config.ini it
# asks for these values and writes the file for you.


# ---------------------------------------------------------------------------
# canvas_url: the address of YOUR school's Canvas
# ---------------------------------------------------------------------------
# Log in to Canvas and copy the address bar up to the first "/" after the
# domain. Examples:
#     https://yourschool.instructure.com
#     https://canvas.yourschool.edu
# Leave off /courses/..., /login and any trailing slash.

canvas_url =


# ---------------------------------------------------------------------------
# api_token: your personal Canvas access token
# ---------------------------------------------------------------------------
# How to get one:
#   1. Log in to Canvas in your browser.
#   2. Click "Account" (your profile picture, top left) -> "Settings".
#   3. Scroll down to "Approved Integrations".
#   4. Click "+ New Access Token".
#   5. Purpose: anything, e.g. "file downloader". Expiry date is optional
#      (leave it blank for no expiry, or set one if you prefer).
#   6. Click "Generate Token" and COPY IT IMMEDIATELY. Canvas only shows the
#      full token once. If you lose it, delete it and make a new one.
#   7. Paste it after "api_token =" below.
#
# The token can see everything you can see in Canvas, so treat it like a
# password: don't share it, post it, or commit it. If it leaks, delete it on
# the same Settings page and make a new one.
#
# No "+ New Access Token" button? Your school has disabled student tokens and
# this tool can't work around that. Ask your school's IT / Canvas admins.

api_token =


# ---------------------------------------------------------------------------
# save_folder: where course folders are created (optional)
# ---------------------------------------------------------------------------
# Leave blank to use a "Canvas" folder in your home directory.
# Each course gets its own subfolder inside this one.

save_folder =
